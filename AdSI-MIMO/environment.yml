# Training and inference environment for AdSI-MIMO
name: adsimimo-train
channels:
  - conda-forge
dependencies:
  - python=3.10.14
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.1.0+cu118          # CUDA 11.8, cuDNN 8.7
      - torchvision==0.16.0+cu118
      - timm==1.0.8
      - einops==0.8.0
      - pytorch-msssim==1.0.0
      - numpy==1.26.3
      - pandas==2.2.2
      - scipy==1.14.0
      - scikit-image==0.24.0
      - scikit-learn==1.5.1
      - opencv-python==4.10.0.84
      - tqdm==4.66.5
      - matplotlib==3.9.2
      - tifffile==2024.8.10
      - Pillow==10.2.0
